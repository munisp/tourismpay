# infra/dapr/components/gap-services-pubsub.yaml
# Dapr pub/sub subscriptions for TourismPay Gap Services
# All services use the shared Kafka-backed pubsub component

apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: pms-events-subscription
spec:
  topic: tourismpay.pms.events
  route: /dapr/subscribe/pms-events
  pubsubname: tourismpay-pubsub
scopes:
  - pms-integration
  - go-settlement-service
---
