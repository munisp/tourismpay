      context: ./services/lakehouse-etl
      dockerfile: Dockerfile
    environment:
      PG_DSN: postgresql://tourismpay_user:${POSTGRES_PASSWORD:-testpass123}@postgres:5432/tourismpay
      LAKEHOUSE_PATH: /data/lakehouse
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      ICEBERG_CATALOG: tourismpay_catalog
      ICEBERG_WAREHOUSE: s3://tourismpay-lakehouse/
      PORT: "8105"
    ports:
      - "8105:8105"
    volumes:
      - lakehouse_data:/data/lakehouse
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8105/health').raise_for_status()"]
