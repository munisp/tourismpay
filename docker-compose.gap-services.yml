# docker-compose.gap-services.yml
# TourismPay Gap Services — 15 new microservices
# Usage: docker compose -f docker-compose.yml -f docker-compose.gap-services.yml up -d
#
# Language breakdown:
#   Go:     pms-integration, bnpl-service, direct-booking-engine, group-travel-service, evisa-payment-service, dcc-service
#   Python: agentic-ai-service, revenue-management-service, tourism-intelligence-api, open-banking-service, geospatial-analytics, lakehouse-etl
#   Rust:   travel-insurance-service, diaspora-gift-service, white-label-engine, accessibility-service, offline-sync-service

services:
  # ─── Go: PMS Integration (port 8090) ────────────────────────────────────────
  pms-integration:
    build:
      context: ./services/pms-integration
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://tourismpay_user:${POSTGRES_PASSWORD:-testpass123}@postgres:5432/tourismpay
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      DAPR_HTTP_PORT: "3500"
      PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "tourismpay.service=pms-integration"
      - "tourismpay.language=go"

