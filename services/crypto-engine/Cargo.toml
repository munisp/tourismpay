[package]
name = "crypto-engine"
version = "0.1.0"
edition = "2021"
description = "TourismPay cryptographic operations engine"

[[bin]]
name = "crypto-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
# Crypto primitives required by tests
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
hmac = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
pbkdf2 = "0.12"
hkdf = "0.12"
digest = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
